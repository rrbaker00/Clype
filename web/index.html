<!doctype html>  <!-- tells the browser this is modern HTML -->
<html lang="en">
<head>
  <meta charset="utf-8">                                                  <!-- text encoding -->
  <meta name="viewport" content="width=device-width, initial-scale=1">  <!-- scale properly on phones -->
  <title>Clype</title>                                           <!-- browser tab text -->
  <link rel="stylesheet" href="style.css">
  <script src="common.js"></script>  <!-- shared helpers (el, host, ...) - must load first -->
  <script src="script.js"></script>  <!-- this page's code -->
</head>
<body onload="load()">  <!-- run load() once the page has finished loading -->
  <div class="wrap">
    <header class="top">
      <div>
        <div class="brand">Clype<span>.</span></div>
        <div class="tag">What websites still send after you click "Reject all"</div>
      </div>
    </header>

    <!-- Big numbers across all audits. script.js fills each id. -->
    <div class="stats">
      <div class="stat">
        <div class="n" id="totalSites">0</div>
        <div class="l">Sites audited</div>
      </div>
      <div class="stat">
        <div class="n" id="totalSeen">0</div>
        <div class="l">Trackers found</div>
      </div>
      <div class="stat ok">
        <div class="n" id="totalBlocked">0</div>
        <div class="l">Stopped by "Reject all"</div>
        <div class="bar"><i id="stopBar" style="width:0"></i></div>  <!-- green progress bar -->
        <div class="l" id="stopPct"></div>
      </div>
      <div class="stat bad">
        <div class="n" id="totalAfter">0</div>
        <div class="l">Still tracking after "Reject all"</div>
      </div>
    </div>

    <!-- Severe: sites that kept tracking after "Reject all". Hidden until script.js finds one. -->
    <div id="severeSection" hidden>
      <h2 class="severe-title">Severe: ignored reject all <span id="severeCount"></span></h2>
      <div class="cards" id="severeCards"></div>
    </div>

    <h2>Audits</h2>
    <div class="cards" id="cards"></div>  <!-- one card per audit, added by script.js -->
  </div>
</body>
</html>
